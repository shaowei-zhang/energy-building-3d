    <textPath href="#hhuArcTop" startOffset="50%" text-anchor="middle">河海大学</textPath>
  </text>

  <g fill="none" stroke-linecap="round">
    <path d="M37 54q7-7 14 0t14 0" stroke="#9BDDF8" stroke-width="3"/>
    <path d="M33 64q7-7 14 0t14 0t14 0" stroke="#5BB3E0" stroke-width="3"/>
    <path d="M37 74q7-7 14 0t14 0" stroke="#2E86AB" stroke-width="3"/>
  </g>

  <text x="60" y="89" text-anchor="middle" font-size="6.4" font-weight="600" fill="#8FD8F7"
        letter-spacing=".7" textLength="62" lengthAdjust="spacingAndGlyphs"
        font-family="Georgia,'Times New Roman',serif">HOHAI UNIVERSITY</text>

  <circle cx="60" cy="60" r="57" fill="url(#hhuSheen)"/>
