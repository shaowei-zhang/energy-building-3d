<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>能源楼 3D 总览</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        /* 与 3D 视图统一的深空科技配色：深蓝底 + 青蓝点缀 */
        --bg: #061224; --bg-2: #0C1E33; --accent: #46A8D6; --green: #5BC98C;
        --amber: #E0B04C; --red: #E3706B;
        --txt: #DCEBF7; --txt-dim: #83A8C2; --line: rgba(94,170,216,.24);
        --card: rgba(12,30,46,.92);
        --font-num: "Bahnschrift","DIN Alternate","Rajdhani","Segoe UI",sans-serif;
        --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--txt);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      #app { height: 100%; width: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
